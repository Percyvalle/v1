# Конфигурация инструментов разработки. Проект не пакет и не собирается —
# секции [build-system]/[project] намеренно отсутствуют, чтобы никто не
# пытался его устанавливать. Здесь только настройки ruff/pytest/mypy.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "logs", "prompts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # длину строк держит formatter, дублировать проверку не нужно
    "B008",  # вызовы в дефолтах аргументов — норма для FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
# SIM103 в _is_skip_reply: прямой возврат условия отдал бы объект Match от
# SILENCE_PATTERN.match(), а не bool, как объявлено в сигнатуре. Цепочка
# guard-clause'ов здесь и честнее по типу, и читается ровнее.
"bot/brain.py" = ["SIM103"]

# Секций [tool.pytest.ini_options] и [tool.mypy] здесь больше нет.
#
# Все тесты этого проекта (30 штук) проверяли panel/auth.py, а панель
# переехала в apps/panel — вместе с ней уехали и они. Оказалось, что 28 из
# 29 тестов были дословной копией тестов панели модерации: два процесса
# держали две копии одного auth.py, и тесты к ним тоже были в двух копиях.
# Осталась одна, в apps/panel/tests/panel/test_auth.py.
#
# mypy проверял ровно те же два пути ("panel/auth.py", "tests/panel"),
# поэтому проверять здесь стало нечего: остальной бот писался без
# аннотаций и был исключён намеренно. Пустой files = [] заставил бы mypy
# ругаться, а не молчать, поэтому секция убрана целиком — конфиг для
# панели теперь в apps/panel/pyproject.toml.
