# Конфигурация инструментов разработки. Проект не пакет и не собирается —
# секции [build-system]/[project] намеренно отсутствуют, чтобы никто не
# пытался его устанавливать. Здесь только настройки ruff/pytest/mypy.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # длину строк держит formatter, дублировать проверку не нужно
    "B008",  # вызовы в дефолтах аргументов — норма для FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
# Скрипты запускаются как файлы, а не как модули пакета, и правят sys.path до
# импортов — причём panel.paths обязан идти перед cigilbot.*, иначе тот ещё
# не найден (бутстрап живёт в panel/__init__.py). Порядок здесь намеренный,
# тот же приём, что "cigilbot/consumer.py" в apps/cigilbot/pyproject.toml.
"scripts/**" = ["E402", "I001"]

[tool.ruff.lint.isort]
# bot и cigilbot лежат в соседних проектах и попадают в импорт через
# sys.path (panel/__init__.py) — ruff по умолчанию считает их сторонними
# и мешает с fastapi/httpx в одну группу. Для читающего человека это код
# этого же репозитория, поэтому группируем вместе с panel.
known-first-party = ["panel", "bot", "cigilbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:panel.*"]
markers = [
    "slow: тесты на реальных данных из БД (прогон истории чата)",
]

[tool.mypy]
# panel/bots_api.py в список НЕ входит: это бывший twitch-bots/panel/server.py,
# написанный без аннотаций, и mypy-конфиг того проекта его тоже не проверял
# (там были только panel/auth.py и tests/panel). Включить его сюда — значит
# утонуть в шуме на 1000 строк, никак не связанном со слиянием панелей.
files = ["panel/auth.py", "panel/paths.py", "panel/moderation_api.py", "panel/registry_api.py", "panel/server.py", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

# Соседние проекты лежат вне этого каталога и подключаются через sys.path в
# panel/__init__.py — mypy про этот трюк не знает и ищет их относительно
# своего корня. Явные пути дают ему то же дерево, что видит рантайм.
mypy_path = "../cigilbot:../twitch-bots"

# Библиотеки без типов — не наша забота
[[tool.mypy.overrides]]
module = ["lingua.*", "twitchio.*", "aiosqlite.*", "streamlink.*"]
ignore_missing_imports = true

# bot.* аннотирован не был и намеренно исключён из проверки в своём проекте
# (см. apps/twitch-bots/pyproject.toml) — панель импортирует из него
# ChannelRegistry и HelixResolver.
#
# follow_imports = "skip", а не только ignore_missing_imports: mypy_path
# выше делает эти модули НАХОДИМЫМИ, а значит mypy начинает их разбирать и
# выдаёт ошибки в чужом непроверяемом коде. skip заставляет считать их Any,
# как и было, пока панель жила в другом проекте и не видела их вовсе.
[[tool.mypy.overrides]]
module = ["bot.*"]
follow_imports = "skip"
ignore_missing_imports = true

# panel/bots_api.py — тот же непроаннотированный код (бывший
# twitch-bots/panel/server.py), только переехавший внутрь этого пакета.
# В files его нет, но server.py импортирует из него router, и без skip
# mypy разбирал бы его по этой ссылке.
[[tool.mypy.overrides]]
module = ["panel.bots_api"]
follow_imports = "skip"
ignore_errors = true
