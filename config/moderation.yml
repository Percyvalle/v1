# Конфигурация движка модерации. Все веса и пороги — здесь, а не в коде:
# правка чувствительности после недели в SHADOW-режиме — это правка файла,
# а не патч Python. Формат версионирован (version) — вердикты в аудите
# хранят номер версии конфига, на котором вынесены, чтобы старые записи
# оставались понятны после изменения весов.
version: 1

# SAFE — максимум защиты от ложных срабатываний.
# BALANCED — рабочий режим по умолчанию.
# AGGRESSIVE — быстрее реагирует на массовые атаки.
# ATTACK — ручной panic mode, включается на канале временно.
# Ни один режим не отключает инвариант "минимум 2 независимых семейства
# сигналов для BAN" — он зашит в policy.py и из конфига не читается.
mode: BALANCED

risk_thresholds:
  observe: 30
  timeout: 60
  ban: 80

confidence:
  minimum_for_timeout: 0.75
  minimum_for_ban: 0.90
  # Сколько НЕЗАВИСИМЫХ семейств сигналов сработало -> множитель уверенности.
  # Два сигнала из одного семейства (например exact_duplicate и
  # near_duplicate — оба CONTENT) не считаются независимым подтверждением.
  family_factor:
    1: 0.45
    2: 0.70
    3: 0.88
    4: 0.95
    5: 0.98
  sample_factor_low: 0.6   # мало наблюдений: 1 сообщение / маленький кластер
  sample_factor_high: 1.0  # много наблюдений: 10+ сообщений / крупный кластер
  context_factor:
    raid: 0.5
    giveaway: 0.5
    hype: 0.8
    normal: 1.0

# Множители режима на итоговый risk_score. AGGRESSIVE и ATTACK повышают
# чувствительность обнаружения, но НЕ снижают требования к confidence и не
# трогают инвариант независимых семейств для BAN.
mode_multipliers:
  SAFE: 0.8
  BALANCED: 1.0
  AGGRESSIVE: 1.25
  ATTACK: 1.5

# Вес и семейство каждого сигнала. family критичен для confidence — сигналы
# одного семейства не считаются независимыми подтверждениями.
signals:
  user_message_burst: {family: timing, weight: 15}
  channel_message_burst: {family: timing, weight: 10}
  exact_duplicate: {family: content, weight: 25}
  near_duplicate: {family: content, weight: 20}
  skeleton_match: {family: content, weight: 15}
  link_present: {family: content, weight: 10}
  shared_link_multi_user: {family: network, weight: 30}
  url_shortener: {family: content, weight: 10}
  known_scam_domain: {family: content, weight: 35}
  invisible_chars: {family: encoding, weight: 25}
  homoglyph_mix: {family: encoding, weight: 20}
  script_mix_in_word: {family: encoding, weight: 10}
  # Язык — самый слабый вес в системе, строго ниже любого другого сигнала.
  # Одного его недостаточно даже для уровня OBSERVE. Он может что-то
  # изменить только внутри кластера, где рядом сработали ещё 5-6
  # независимых сигналов. См. docs/moderation-plan.md.
  unexpected_language: {family: encoding, weight: 3}
  new_account: {family: identity, weight: 10}
  first_message: {family: identity, weight: 5}
  no_history: {family: identity, weight: 5}
  generated_username_pattern: {family: identity, weight: 8}
  emote_spam: {family: content, weight: 10}
  zalgo_text_spam: {family: content, weight: 8}
  synchronized_arrival: {family: timing, weight: 25}
  cluster_membership: {family: network, weight: 25}
  mass_first_messages: {family: network, weight: 20}
  # Совпадение по значимым словам (без учёта порядка) — ловит
  # перефразированный self-promo спам, который exact/near_duplicate
  # (посимвольные триграммы) пропускают. См. detectors/keyword_overlap.py.
  keyword_overlap: {family: content, weight: 20}
  # Забанен хоть где-то — сильное свидетельство, но не автобан в одиночку:
  # MIN_FAMILIES_FOR_BAN=2 всё равно требует второй независимый сигнал
  # (cigilbot/policy.py). См. cigilbot/detectors/cross_channel.py.
  known_bad_actor: {family: history, weight: 30}

detectors:
  burst:
    enabled: true
    user_messages_threshold: 10
    user_window_seconds: 5.0
    channel_messages_threshold: 30
    channel_window_seconds: 10.0

  duplicate:
    enabled: true
    # Было 25.0 — растянутая по времени self-promo кампания (боты пишут
    # с интервалом 7-15 сек, не подряд) выходила за окно сравнения раньше,
    # чем набиралось достаточно совпадений (проверено прогоном на 12
    # ботах, растянутых на 90 сек: max risk=17 из 100, ни одного кластера).
    window_seconds: 90.0
    near_duplicate_threshold: 0.75
    skeleton_min_length: 12
    # Короче — не считается дубликатом ни с кем. Без этого "ку", "гг",
    # "+1" от разных обычных зрителей давали ложный exact_duplicate —
    # найдено прогоном по реальному чату (этап 6 плана).
    min_content_length: 6

  links:
    enabled: true
    shared_link_window_seconds: 30.0
    shared_link_min_users: 3
    known_scam_domains: []

  unicode:
    enabled: true

  language:
    enabled: true
    expected_languages: [ru, en]
    min_confidence: 0.65

  account:
    enabled: true
    new_account_days: 7.0
    no_history_message_count: 1

  username:
    enabled: true

  emote:
    enabled: true
    repeat_threshold: 8

  keyword_overlap:
    enabled: true
    window_seconds: 90.0
    overlap_threshold: 0.35
    min_significant_words: 1
    min_matches: 3

  cross_channel:
    enabled: true

# Группировка пользователей, действующих согласованно (раздел "Cluster
# Detection" в docs/moderation-plan.md). Отдельно от detectors: детекторы
# выше оценивают ОДНО сообщение, а кластеризация ищет связи МЕЖДУ разными
# пользователями за окно времени.
cluster:
  enabled: true
  # Было 60.0 — тот же прогон (12 ботов, интервалы 7-15 сек, суммарно
  # 90 сек) показал, что первые и последние участники кампании выпадают
  # из окна и не объединяются в один кластер даже при полном текстовом
  # совпадении.
  window_seconds: 120.0
  min_users: 4
  # Было 20.0 — жёстко отсекало ЛЮБОЙ кластер, растянутый по времени
  # дольше этого окна, даже при полном текстовом/словарном совпадении
  # (проверено прогоном: union-find нашёл единую группу из 12 ботов через
  # общие ключевые слова, но arrival_window > 20 сек отбросил её целиком,
  # 0 кластеров, до этого изменения). 90 секунд достаточно для типичной
  # растянутой self-promo кампании (интервалы 7-15 сек между участниками),
  # но всё ещё отсекает пользователей, появившихся в чате в разное время
  # по совпадению, не в рамках одной кампании.
  arrival_window_seconds: 90.0
  similarity_threshold: 0.75
  # Короче — сообщение не формирует связь по содержимому. Без этого "+",
  # "гг", "лол" от сотни разных зрителей в хайп-момент стали бы кластером.
  min_content_length_for_edge: 6
  mass_first_message_ratio_threshold: 0.5
  # Ручной стоп-лист устойчивых оборотов чата конкретного канала. Пусто по
  # умолчанию — заполняется по итогам replay на истории (этап 6 в плане).
  excluded_phrases: []

# Автоматическое доверие по истории (этап 9a). Пользователь с достаточным
# стажем на канале получает сниженный risk_score (не полную защиту —
# это TrustLevel.REGULAR, а не TRUSTED/marked_safe, которые даёт только
# ручной MARK SAFE). Оба порога должны выполниться одновременно — см.
# докстринг TrustConfig в cigilbot/config.py.
trust:
  enabled: true
  min_messages_for_regular: 20
  min_days_for_regular: 3.0
  regular_risk_multiplier: 0.7
